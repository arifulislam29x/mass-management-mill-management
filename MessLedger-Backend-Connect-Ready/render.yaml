services:
  - type: web
    name: messledger-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: messledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/mess.db
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
